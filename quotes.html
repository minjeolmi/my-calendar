<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Quotes Widget</title>
  <style>
    body {
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    body::-webkit-scrollbar { display: none; }
    
    .quote-card {
      max-width: 650px;
      width: 100%;
      background-color: #ffffff;
      border: 1px solid #e3e2e0;
      border-radius: 12px;
      padding: 24px;
      box-sizing: border-box;
      text-align: left;
      box-shadow: rgba(15, 15, 15, 0.04) 0px 1px 4px;
    }
    
    .quote-text {
      font-size: 15px;
      line-height: 1.65;
      margin-bottom: 14px;
      white-space: pre-wrap;
      color: #37352f;
      letter-spacing: -0.01em;
    }
    .quote-info {
      font-size: 13px;
      color: #787774;
      font-weight: 500;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #191919;
      }
      .quote-card {
        background-color: #202020;
        border: 1px solid #2f2f2f;
        box-shadow: none;
      }
      .quote-text {
        color: #e3e3e3;
      }
      .quote-info {
        color: #757575;
      }
    }
  </style>
</head>
<body>
  <div class="quote-card">
    <div class="quote-text" id="quote">오늘의 문장을 가져오는 중...</div>
    <div class="quote-info" id="info"></div>
  </div>

  <script>
    async function loadDailyQuote() {
      try {
        const response = await fetch('https://my-calendar-six-zeta.vercel.app/api/quotes');
        const data = await response.json();
        
        if (data.error) {
          document.getElementById('quote').innerText = "데이터 로드 실패: " + data.error;
          return;
        }
        
        document.getElementById('quote').innerText = data.quote;
        
        // 책 제목과 페이지 정보만 깔끔하게 조합 (예: 월든 · p.142)
        let infoParts = [];
        if (data.book) infoParts.push(data.book);
        if (data.page) infoParts.push(data.page);
        
        document.getElementById('info').innerText = infoParts.join(' · ');
      } catch (err) {
        document.getElementById('quote').innerText = "서버와 연결할 수 없습니다.";
      }
    }
    loadDailyQuote();
  </script>
</body>
</html>
