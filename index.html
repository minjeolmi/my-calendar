<html>
<head>
<style>
    
@import url('https://fonts.googleapis.com/css?family=Nunito:400,600');
:root {
    --calendar-bg-color: #222222; /* 살짝 더 무거운 다크톤으로 조정 */
    --calendar-font-color: #FFF;
    --weekdays-border-bottom-color: #404040;
    --calendar-date-hover-color: #505050;
    --calendar-current-date-color: #1b1f21;
    --calendar-today-color: #2196F3;
    --calendar-today-innerborder-color: #000;
    --calendar-nextprev-bg-color: #1a1f21;
}

* {
    padding: 0;
    margin: 0;
}

body {
    background-color: #262829;
}

.calendar {
    font-family: 'Nunito', sans-serif;
    position: relative;
    max-width: 450px; /* 포스터가 시원하게 보이도록 가로폭 살짝 확대 */
    min-width: 320px;
    background: var(--calendar-bg-color);
    color: var(--calendar-font-color);
    margin: 20px auto;
    box-sizing: border-box;
    overflow: hidden;
    font-weight: normal;
    border-radius: 12px;
}

.calendar-inner {
    padding: 15px;
}

.calendar .calendar-inner .calendar-body {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
}

/* 이미지 격자 칸 스타일 수정 */
.calendar .calendar-inner .calendar-body div {
    position: relative; /* 이미지와 숫자를 겹치게 하기 위함 */
    margin: 4px 2px;
    min-height: 85px; /* 세로로 긴 포스터 비율을 위해 높이 확보 */
    border: 1px solid #333;
    border-radius: 6px;
    overflow: hidden;
    box-sizing: border-box;
}

/* 요일 표시 칸은 배경색과 높이 고정 */
.calendar .calendar-inner .calendar-body div.weekday-label {
    min-height: 35px;
    line-height: 35px;
    border: none;
    border-bottom: 1px solid var(--weekdays-border-bottom-color);
    border-radius: 0;
    margin-bottom: 10px;
}

.calendar .calendar-inner .calendar-body div.weekday-label:hover {
    border: none;
    border-bottom: 1px solid var(--weekdays-border-bottom-color);
}

/* 날짜 숫자 스타일 (이미지 위에서도 잘 보이도록 그림자 추가) */
.calendar .calendar-inner .calendar-body div>a {
    color: var(--calendar-font-color);
    text-decoration: none;
    position: absolute;
    top: 5px;
    left: 8px;
    z-index: 10; /* 이미지보다 무조건 위로 */
    font-weight: 600;
    font-size: 14px;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8), -1px -1px 3px rgba(0, 0, 0, 0.8);
}

/* 포스터 이미지 스타일 */
.calendar-poster {
    width: 100%;
    height: 100%;
    object-fit: cover; /* 칸에 꽉 차게 조절 */
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
}

.calendar .calendar-inner .calendar-body div:hover {
    border: 1px solid var(--calendar-date-hover-color);
}

.calendar .calendar-inner .calendar-body div.empty-dates {
    border: 1px solid transparent;
    background: rgba(0,0,0,0.1);
}

.calendar .calendar-inner .calendar-body div.empty-dates:hover {
    border: 1px solid transparent;
}

.calendar .calendar-inner .calendar-controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
}

.calendar .calendar-inner .calendar-controls a {
    color: var(--calendar-font-color);
}

.calendar .calendar-inner .calendar-today-date {
    display: grid;
    text-align: center;
    cursor: pointer;
    margin: 3px 0px 15px 0px;
    background: var(--calendar-current-date-color);
    padding: 8px 0px;
    border-radius: 6px;
}

.calendar .calendar-inner .calendar-controls .calendar-year-month {
    display: flex;
    min-width: 100px;
    justify-content: space-evenly;
    align-items: center;
}

.calendar .calendar-inner .calendar-controls .calendar-next {
    text-align: right;
}

.calendar .calendar-inner .calendar-controls .calendar-year-month .calendar-year-label,
.calendar .calendar-inner .calendar-controls .calendar-year-month .calendar-month-label {
    font-weight: bold;
    font-size: 20px;
}

/* 오늘 날짜 표시 스타일 살짝 조정 */
.calendar .calendar-inner .calendar-body .calendar-today {
    border: 1px solid var(--calendar-today-color);
}

.calendar .calendar-inner .calendar-body .calendar-today:hover {
    border: 1px solid var(--calendar-today-color);
}

.calendar .calendar-inner .calendar-controls .calendar-next a,
.calendar .calendar-inner .calendar-controls .calendar-prev a {
    font-family: consolas, sans-serif;
    font-size: 26px;
    text-decoration: none;
    padding: 4px 12px;
    display: inline-block;
    background: var(--calendar-nextprev-bg-color);
    margin: 0 0 10px 0;
    border-radius: 6px;
}
    /* --- 달력 및 포스터 크기 키우기 오버라이드 --- */

/* 1. 달력 전체 최대 너비 제한 풀기 */
.calendar {
  max-width: 900px !important; /* 기존보다 가로를 훨씬 널찍하게 변경 */
  width: 100% !important;
}

/* 2. 날짜 칸 세로 높이 키우기 */
.calendar-body > div {
  min-height: 150px !important; /* 각 날짜 칸의 세로 길이를 늘려서 포스터 공간 확보 */
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  position: relative;
  padding-bottom: 5px;
}

/* 3. 포스터 이미지 크기 키우고 꽉 채우기 */
.calendar-poster {
  width: 90% !important;
  height: 110px !important; /* 세로 크기 대폭 확대 */
  object-fit: cover !important; /* 이미지가 비율 깨지지 않고 칸에 꽉 차게 조절 */
  border-radius: 6px !important;
  margin-top: 4px !important;
}

/* 4. 날짜 숫자 위치 살짝 조정 */
.dateNumber {
  margin-bottom: 2px !important;
  font-size: 14px !important;
}
</style>
</head>
<body>
    <div class="calendar"></div>
</body>

<script>
// 실시간 노션 데이터를 담을 객체 (처음엔 빈 상태)
let posterData = {};

// Vercel 서버에서 데이터를 받아온 뒤 달력을 구동하는 함수
async function initLiveCalendar() {
  try {
    // ⚠️ 여기에 복사한 젤미의 Vercel 주소를 넣고 뒤에 /api/movies 를 붙여주면 돼!
    const response = await fetch('https://my-calendar-six-zeta.vercel.app/api/movies');
    posterData = await response.json();
  } catch (err) {
    console.error("노션 데이터를 가져오는데 실패했어:", err);
  }
  
  // 데이터 로드가 끝나면 달력 구동
  CalendarControl();
}

function CalendarControl() {
  const calendar = new Date();
  const calendarControl = {
    localDate: new Date(),
    calWeekDays: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
    calMonthName: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
    daysInMonth: function(month, year) {
      return new Date(year, month, 0).getDate();
    },
    firstDay: function() {
      return new Date(calendar.getFullYear(), calendar.getMonth(), 1);
    },
    lastDay: function() {
      return new Date(calendar.getFullYear(), calendar.getMonth() + 1, 0);
    },
    firstDayNumber: function() {
      return calendarControl.firstDay().getDay() + 1;
    },
    lastDayNumber: function() {
      return calendarControl.lastDay().getDay() + 1;
    },
    navigateToPreviousMonth: function() {
      calendar.setMonth(calendar.getMonth() - 1);
      calendarControl.attachEventsOnNextPrev();
    },
    navigateToNextMonth: function() {
      calendar.setMonth(calendar.getMonth() + 1);
      calendarControl.attachEventsOnNextPrev();
    },
    navigateToCurrentMonth: function() {
      let currentMonth = calendarControl.localDate.getMonth();
      let currentYear = calendarControl.localDate.getFullYear();
      calendar.setMonth(currentMonth);
      calendar.setYear(currentYear);
      calendarControl.attachEventsOnNextPrev();
    },
    displayYear: function() {
      let yearLabel = document.querySelector(".calendar .calendar-year-label");
      yearLabel.innerHTML = calendar.getFullYear();
    },
    displayMonth: function() {
      let monthLabel = document.querySelector(".calendar .calendar-month-label");
      monthLabel.innerHTML = calendarControl.calMonthName[calendar.getMonth()];
    },
    selectDate: function(e) {
      console.log(`${e.target.textContent} ${calendarControl.calMonthName[calendar.getMonth()]} ${calendar.getFullYear()}`);
    },
    plotSelectors: function() {
      document.querySelector(".calendar").innerHTML += `<div class="calendar-inner"><div class="calendar-controls">
      <div class="calendar-prev"><a href="#"><</a></div>
      <div class="calendar-year-month">
      <div class="calendar-month-label"></div>
      <div>-</div>
      <div class="calendar-year-label"></div>
      </div>
      <div class="calendar-next"><a href="#">></a></div>
      </div>
      <div class="calendar-today-date">Today: 
        ${calendarControl.calWeekDays[calendarControl.localDate.getDay()]}, 
        ${calendarControl.localDate.getDate()}, 
        ${calendarControl.calMonthName[calendarControl.localDate.getMonth()]} 
        ${calendarControl.localDate.getFullYear()}
      </div>
      <div class="calendar-body"></div></div>`;
    },
    plotDayNames: function() {
      for (let i = 0; i < calendarControl.calWeekDays.length; i++) {
        document.querySelector(".calendar .calendar-body").innerHTML += `<div class="weekday-label">${calendarControl.calWeekDays[i]}</div>`;
      }
    },
    plotDates: function() {
      document.querySelector(".calendar .calendar-body").innerHTML = "";
      calendarControl.plotDayNames();
      calendarControl.displayMonth();
      calendarControl.displayYear();
      
      let count = 1;
      let prevDateCount = 0;
      let calendarDays = calendarControl.daysInMonth(calendar.getMonth() + 1, calendar.getFullYear());
      let firstDayNo = calendarControl.firstDayNumber();

      // 빈 날짜 채우기
      for (let i = 1; i < firstDayNo; i++) {
        prevDateCount += 1;
        document.querySelector(".calendar .calendar-body").innerHTML += `<div class="empty-dates"></div>`;
      }

      // 진짜 날짜 채우기 로직
      while (count <= calendarDays) {
        let currentMonthNo = calendar.getMonth() + 1;
        let currentYear = calendar.getFullYear();
        
        // 날짜를 YYYY-MM-DD 규격 텍스트로 생성 (매칭용)
        let dateKey = `${currentYear}-${String(currentMonthNo).padStart(2, '0')}-${String(count).padStart(2, '0')}`;
        
        // 해당 날짜에 등록된 포스터 이미지가 있는지 검사
        let imgTag = "";
        if (posterData[dateKey]) {
            imgTag = `<img class="calendar-poster" src="${posterData[dateKey]}" />`;
        }

        let isToday = (
            calendarControl.localDate.getFullYear() === currentYear &&
            (calendarControl.localDate.getMonth() + 1) === currentMonthNo &&
            count === calendarControl.localDate.getDate()
        );

        let divClass = isToday ? "calendar-today" : "";
        
        document.querySelector(".calendar .calendar-body").innerHTML += `
          <div class="${divClass}">
            <a class="dateNumber" href="#">${count}</a>
            ${imgTag}
          </div>`;
          
        count++;
      }
    },
    attachEvents: function() {
      let prevBtn = document.querySelector(".calendar .calendar-prev a");
      let nextBtn = document.querySelector(".calendar .calendar-next a");
      let todayDate = document.querySelector(".calendar .calendar-today-date");
      let dateNumber = document.querySelectorAll(".calendar .dateNumber");
      prevBtn.addEventListener("click", calendarControl.navigateToPreviousMonth);
      nextBtn.addEventListener("click", calendarControl.navigateToNextMonth);
      todayDate.addEventListener("click", calendarControl.navigateToCurrentMonth);
      for (var i = 0; i < dateNumber.length; i++) {
        dateNumber[i].addEventListener("click", calendarControl.selectDate, false);
      }
    },
    attachEventsOnNextPrev: function() {
      calendarControl.plotDates();
      calendarControl.attachEvents();
    },
    init: function() {
      calendarControl.plotSelectors();
      calendarControl.plotDates();
      calendarControl.attachEvents();
    }
  };
  calendarControl.init();
}

// 실시간 연동 시작 함수 호출
initLiveCalendar();
</script>
</html>
